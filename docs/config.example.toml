# ContextOS MCP example configuration
#
# This file shows every currently supported configuration field.
# Environment overrides:
# - CONTEXTOS_MCP_CONFIG: path to this file
# - CONTEXTOS_MCP_TOKEN: overrides [server.http].token or token_env
# - CONTEXTOS_MCP_LOG_LEVEL: overrides [server].log_level

[server]
# Allowed values: "stdio", "http"
transports = ["stdio"]
# Allowed values: "error", "warn", "info", "debug", "trace"
log_level = "info"
# Empty means log to stderr only. Every contextos process loading this file
# shares the one log file, which is safe: rotation is coordinated between them.
# Where a background service would lose stderr, `contextos config` offers a
# file: %LOCALAPPDATA%\contextos\logs\contextos.log on Windows,
# ~/Library/Logs/contextos/contextos.log on macOS.
log_file = ""
# Rotates log_file once it reaches this size, in megabytes. Meaningless
# (and rejected) while log_file is empty.
# log_max_size_mb = 50
# Rotates log_file on every UTC calendar-day boundary. Combinable with
# log_max_size_mb: whichever condition is reached first triggers a rotation.
# log_rotate_daily = false
# Deletes a rotated log file once it is older than this many days.
# log_retention_days = 14
# Keeps only the N most recently rotated log files, deleting older ones.
# log_retention_files = 5
# Size (in KB) at or above which a text-reading tool result attaches a
# resource_link alongside a bounded inline preview, instead of returning the
# full content inline.
resource_link_threshold_kb = 5
# The IANA time zone every time written into a vault is shown in (note
# created/updated stamps, operation log days, and the dates contextos-web gives
# new notes and journal entries), daylight saving included. Omit to use the
# host's own zone. Never a fixed offset such as "+10:00".
# timezone = "Australia/Sydney"
# Registers the ephemeris_* tools (moon phase, solar events,
# Wheel-of-the-Year, personal-year period) into the advertised MCP tool
# catalogue. Off by default: a niche, personal-practice
# capability kept out of a standard tool list unless explicitly opted into.
# Every ephemeris tool handler is always compiled in regardless of this
# setting; it controls runtime visibility only, and can be overridden per
# run with --astro.
astro = false

[server.http]
# Only used when "http" transport is enabled.
bind = "127.0.0.1:3737"
# Required when binding on a non-loopback address: write the token itself
# in token, or name an environment variable holding it in token_env. Set one
# or the other, never both.
token = ""
token_env = ""
max_body_kb = 14336

[[vault]]
# Absolute path to a vault root.
path = "/absolute/path/to/your/vault"
# Addresses this vault as name://relative-path, on every path-accepting
# tool parameter, on the existing vault-selector parameters, and as the
# only scheme resources/list, resources/read, and fs_attach_file use.
# Optional: defaults to the root directory's basename. Must be a valid
# URI scheme token (a letter, then only letters, digits, "+", "-", ".")
# and unique across every configured vault; an invalid or colliding
# name, explicit or defaulted, is a hard error at startup.
name = "mine"
# If false, the vault is filesystem-only: the tools still read and write its
# files, but managed index.md maintenance, the operation log, Git recovery, and
# search are all off for it.
managed = true

# Path patterns hidden from every enumeration surface for this vault
# (resources/list, fs_list_directory,
# fs_directory_tree, fs_search_files). Layered on top of the built-in
# baseline (.git/, .contextos/), never instead of it. Distinct from
# [vault.search].exclude (search corpus) and [vault.index_md].exclude
# (managed index.md generation). A direct, explicit-path read is never
# restricted by this.
hidden = [".git/", ".git/**", ".contextos/", ".contextos/**"]

# Glob patterns naming which files resources/list itself enumerates for
# this vault (an allowlist, the opposite of hidden's denylist), scoped to
# resources/list only, not the four listing tools above. Default (unset):
# resources/list reports nothing for this vault. Eagerly listing every
# file has little discovery value once a vault holds thousands of them;
# resources/read and resources/templates/list remain unrestricted
# regardless of this setting, so a caller that already knows a path can
# always read it directly. Every pattern here is still subject to hidden.
# Illustrative only: pick the directories actually worth surfacing to a
# resource-aware host for your own vault.
resources_list_include = [
  "memory/entities/**",
  "memory/identity/**",
  "memory/operating/**",
  "registry/*",
  "templates/**",
]

# Optional override for derived state storage.
# - null/unset: platform app-data location (recommended)
# - relative path: resolved from vault root
# - absolute path: used as-is
state_directory = "/absolute/path/to/derived-state"

[vault.limits]
max_read_mb = 5
max_batch_files = 50

[vault.index_md]
enabled = true
exclude = [
  ".contextos",
  ".git",
  ".obsidian",
  "memory/log",
  "memory/sessions",
  "memory/jobs",
  "memory/events",
]

[vault.oplog]
enabled = true
path = "memory/log"

[vault.git]
enabled = true
commit_debounce_s = 30
author_name = "ContextOS MCP"
author_email = "mcp@contextos.local"
destructive_delete = false
# Portable relative paths only.
restore_exclude = ["memory/log", "memory/sessions", "memory/coding", "memory/jobs", "memory/events"]

[vault.events]
# Days an info event under memory/events is kept before the daily sweep deletes
# it. Zero is refused. An event kind's own retention_days overrides this.
retention_days = 90
# Keep warning and error events while they are still open (nothing has cleared
# them); once cleared they age out by the same window as info events. When false
# they age out by the window whether open or not.
keep_attention = true

[vault.search]
text = true
graph = true
# The link graph's persistence backend. Allowed values: "sqlite" (the
# default; WAL mode, tolerates more than one contextos process against
# the same vault at once, for example Claude Cowork's general connector
# instance plus a per-task instance), "fjall" (an embedded KV store,
# single-process-exclusive, fastest when only one process ever opens the
# vault), "serde" (a single JSON file, simplest, no cross-process
# concurrency guarantee, for a small, starter, or experimental vault).
graph_backend = "sqlite"
# Semantic indexing is expensive and not always needed. Disable it to save time
# and disk space if you don't need semantic search.
semantic = true
# Paths excluded from the search corpus (text, graph, and semantic
# indexing). Independent of [vault.index_md].exclude, which only scopes
# managed index.md generation.
exclude = [
  ".contextos",
  ".git",
  ".obsidian",
  "memory/log",
  "memory/sessions",
  "memory/jobs",
  "memory/events",
]
# Default budget, in seconds, for query_index_rebuild's semantic phase when a
# call omits budget_seconds. A per-call budget_seconds always overrides this.
# Some agents (Claude Cowork, for example) may impose a lower ceiling on the budget
# may restart the MCP process if the rebuild exceeds that ceiling.
rebuild_budget_seconds = 25

[vault.search.embedding]
# Allowed values: "local", "openai-compatible"
provider = "local"
# Used by openai-compatible providers.
model = "sentence-transformers/all-MiniLM-L6-v2"
# Used by openai-compatible providers.
endpoint = ""
# The API key used by openai-compatible providers: write the key itself
# in api_key, or name an environment variable holding it in api_key_env.
# Set one or the other, never both.
api_key = ""
api_key_env = ""
# Local provider model files. Run `contextos model download` to fetch the
# default model into this directory. It can point at the exact model
# directory `contextos model list` prints, or, more simply, at the shared
# cache root itself (as below): ContextOS resolves the specific model
# inside it automatically. Sharing this same root with mempalace-rs (or
# any other application using the same cache) reuses one on-disk copy of
# the model instead of downloading it again.
model_directory = "/home/you/.fastembed_cache"

[vault.links]
# Folders whose notes are not checked as link sources by doctor's
# link_integrity check and query_graph's unresolved and unlinked operations.
# Replaces the default list, so the defaults are repeated here;
# [vault.search].exclude is always added. Links into these folders are
# still checked.
exclude = ["templates", "memory/events", "memory/jobs", ".contextos"]
# Folders whose files are not checked as link targets by link_integrity and
# unresolved: a link into one, broken or not, is left out and counted apart.
# For folders whose contents come and go. Empty by default, nothing added.
ignore_targets = ["inbox", "outbox"]

# Optional second vault example: openai-compatible embeddings.
[[vault]]
path = "/absolute/path/to/another/vault"
name = "family"
managed = true

[vault.search]
text = true
graph = true
# Example: a vault opened by more than one contextos process at once (see
# the primary vault's graph_backend comment above).
graph_backend = "sqlite"
semantic = true

[vault.search.embedding]
provider = "openai-compatible"
model = "text-embedding-3-small"
endpoint = "https://api.openai.com/v1/embeddings"
# Or write the key itself: api_key = "sk-..."
api_key_env = "OPENAI_API_KEY"
# model_directory is only used by provider = "local".

# Agent host projection: keeps Claude Code's and Codex's user-level agent and
# skill folders in step with every vault's registry/agents/ and
# registry/skills/ definitions. The first [[vault]] above that defines a name
# wins when several do.
#
# With no [projection] section, a configuration file that exists at the
# platform default location (~/.config/contextos/config.toml) and lists its own
# vaults projects with the defaults shown here. With no file there, or when
# vaults come from --vault, nothing is projected. A configuration named by
# --config or CONTEXTOS_MCP_CONFIG does not project unless it sets
# enabled = true. An explicit enabled always wins. Any unknown key is a
# configuration error.
#
# An agents or skills folder that is itself a symbolic link stops the server
# starting; point it at a real folder, or set enabled = false here or in the
# host's table.
[projection]
enabled = true

# Claude Code. Every path must be absolute after "~" is expanded from the home
# directory, and must lie outside every vault root.
[projection.claude]
enabled = true
agents = "~/.claude/agents"
skills = "~/.claude/skills"
instructions = "~/.claude/CLAUDE.md"
# The name ContextOS is registered under in Claude Code. A read-only agent is
# allowed every non-mutating ContextOS tool as mcp__<mcp_server>__<tool>.
mcp_server = "contextos"

# The model each tier of agent definition resolves to.
[projection.claude.tiers]
fast = "haiku"
balanced = "sonnet"
deep = "opus"

# Codex. A read-only agent is only partly enforced: Codex switches off shell,
# apps, and plugins, while MCP tools stay available.
[projection.codex]
enabled = true
agents = "~/.codex/agents"
skills = "~/.agents/skills"
instructions = "~/.codex/AGENTS.md"

# Each Codex tier takes an optional model (left out, Codex uses its own default)
# and a reasoning effort: minimal, low, medium, high, xhigh, or max.
[projection.codex.tiers.fast]
effort = "low"

[projection.codex.tiers.balanced]
effort = "medium"

[projection.codex.tiers.deep]
effort = "high"

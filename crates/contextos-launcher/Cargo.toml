[package]
name = "contextos-launcher"
description = "Stable launcher: runs the active contextos/contextos-web release, and installs, updates, and removes them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "contextos-launcher"
path = "src/main.rs"

[dependencies]
clap.workspace = true
contextos-host = { path = "../contextos-host" }
updater-core = { workspace = true }
updater-engine = { workspace = true }
updater-launcher = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true

<div
  class="mcp-server-connection"
{% if connection.connecting %}
  hx-get="/settings/mcp-servers/{{ connection.name_encoded }}/connection"
  hx-trigger="load delay:1s"
  hx-swap="outerHTML"
{% endif %}
  aria-live="polite"
>
  <span class="conn-dot conn-{{ connection.dot }}" role="img" aria-label="{{ connection.label }}" title="{{ connection.label }}"></span>
  <span class="mcp-server-connection-label">{{ connection.label }}</span>
{% if !connection.connecting %}
  <button
    type="button"
    class="btn small mcp-server-reconnect"
    hx-post="/settings/mcp-servers/{{ connection.name_encoded }}/reconnect"
    hx-target="closest .mcp-server-connection"
    hx-swap="outerHTML"
  >Reconnect</button>
{% endif %}
{% if connection.offers_oauth_connect %}
  <button type="button" class="btn small primary" hx-post="/settings/oauth/{{ connection.name_encoded }}/connect">Sign in</button>
{% endif %}
{% if let Some(remedy) = connection.remedy %}
  <p class="hint mcp-server-remedy">{{ remedy }}</p>
{% endif %}
{% if let Some(cause) = connection.cause %}
  <p class="hint mcp-server-cause"><code>{{ cause }}</code></p>
{% endif %}
</div>

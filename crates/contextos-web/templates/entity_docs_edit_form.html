{% macro form(page_href, edit_body, edit_expected_hash) %}
<form
  class="entity-docs-edit-form"
  hx-patch="{{ page_href }}"
  hx-target="closest .entity-docs-screen"
  hx-swap="outerHTML"
>
  <input type="hidden" name="expected_hash" value="{{ edit_expected_hash }}">
  <div class="save-bar save-bar-top">
    <button type="submit" class="btn primary small">Save</button>
    <button
      type="button"
      class="btn small"
      hx-get="{{ page_href }}"
      hx-select="#entity-docs-main-body"
      hx-target="#entity-docs-main-body"
      hx-swap="outerHTML"
    >Cancel</button>
  </div>
  <textarea name="content" class="notes-body-textarea" autofocus>{{ edit_body }}</textarea>
  <div class="save-bar">
    <button type="submit" class="btn primary small">Save</button>
    <button
      type="button"
      class="btn small"
      hx-get="{{ page_href }}"
      hx-select="#entity-docs-main-body"
      hx-target="#entity-docs-main-body"
      hx-swap="outerHTML"
    >Cancel</button>
  </div>
</form>
{% endmacro %}

<li{% if let Some(id) = line.dom_id %} id="{{ id }}"{% endif %} class="signal-event signal-{{ line.severity }}" data-kind="{{ line.kind }}" data-severity="{{ line.severity }}" data-entity="{{ line.entity }}"><time datetime="{{ line.iso }}">{{ line.time }}</time> <span class="status-chip {{ line.colour }}">{{ line.severity }}</span> <span class="signal-kind" title="{{ line.kind }}">{{ line.label }}</span>{% if let Some(href) = line.subject_href %} <a class="signal-subject" href="{{ href }}">{{ line.subject_label }}</a>{% endif %} <span class="signal-entity hint">{{ line.entity }}</span>{% if !line.detail.is_empty() %} <span class="signal-detail hint">{{ line.detail }}</span>{% endif %}</li>

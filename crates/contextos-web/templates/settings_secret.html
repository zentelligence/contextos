<span class="secret-control" aria-live="polite">
{% if let Some(revealed) = secret.revealed %}
{% match revealed %}
{% when Revealed::Value(value) %}
  <code class="secret-value">{{ value }}</code>
{% when Revealed::UnsetVariable(variable) %}
  <span class="hint">${{ variable }} is not set in contextos-web's environment.</span>
{% endmatch %}
  <button type="button" class="btn small" hx-vals="unset" hx-get="{{ secret.url }}?view=obscured" hx-target="closest .secret-control" hx-swap="outerHTML">Hide</button>
{% else %}
  <span class="secret-obscured" aria-label="Hidden">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
  <button type="button" class="btn small" hx-vals="unset" hx-get="{{ secret.url }}" hx-target="closest .secret-control" hx-swap="outerHTML">Show</button>
{% endif %}
</span>

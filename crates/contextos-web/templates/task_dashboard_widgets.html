<div class="dashboard-task-widgets">
  <section class="settings-section">
    <div class="tasks-dashboard-header">
      <h2>Task lifecycle</h2>
      <a class="btn small" href="{{ tasks_href }}">Open tasks</a>
    </div>
    <div class="task-stage-strip">
    {% for group in stage_groups %}
    <div class="task-stage-group" role="group" aria-label="{{ group.label }} stages">
      <span class="task-stage-group-label" aria-hidden="true">{{ group.label }}</span>
      <div class="task-stage-group-tiles">
      {% for stage in group.tiles %}
        <a class="task-stage-tile" href="{{ stage.href }}">
        {% if let Some(icon) = stage.icon %}
          <span class="ic ic-{{ icon }}" aria-hidden="true"></span>
        {% endif %}
          <span class="task-stage-count">{{ stage.count }}</span>
          <span class="task-stage-label">{{ stage.label }}</span>
        </a>
      {% endfor %}
      </div>
    </div>
  {% endfor %}
      <a class="task-stage-tile task-stage-tile-attention" href="{{ attention.href }}" title="Tasks whose most recent event is a warning or an error">
        <span class="ic ic-octagon-alert" aria-hidden="true"></span>
        <span class="task-stage-count">{{ attention.count }}</span>
        <span class="task-stage-label">Attention</span>
      </a>
    </div>
  </section>
</div>

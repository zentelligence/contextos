<div class="notes-main-body" id="insights-main-body">
  <p class="hint">Delete &quot;{{ title }}&quot; ({{ filename }})? It will be moved to the vault's trash.</p>
  <div class="notes-delete-confirm-actions">
    <button
      type="button"
      class="btn small"
      hx-delete="{{ urls.insights(path) }}"
      hx-target="closest .insights-screen"
      hx-swap="outerHTML"
    >Confirm delete</button>
    <button
      type="button"
      class="btn small"
      hx-get="{{ urls.insights(path) }}"
      hx-target="closest .insights-screen"
      hx-swap="outerHTML"
    >Cancel</button>
  </div>
</div>

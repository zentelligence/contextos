name: Release

# Packaging and release under the versioned release-set model: pushing a version tag
# (vMAJOR.MINOR.PATCH, matching workspace.package's `version`) builds
# `contextos`, `contextos-web`, and `contextos-launcher` natively on
# Linux, Windows, and Apple Silicon macOS; assembles each platform's
# `bin/{contextos,contextos-web,contextos-launcher}` plus a `release.json`
# into one checksummed archive; aggregates every target's asset into one
# signed `latest.json`; and publishes everything as assets on a GitHub
# Release for that tag.
#
# The release starts as a prerelease, which `releases/latest` never serves, so
# no client can reach it yet. `verify-install` then installs it on every
# platform, through its real manifest URL, signature, and archives, and only
# `promote` makes it the latest release. A failed install leaves a prerelease
# that clients never see.
#
# PREREQUISITES: the updater crates and the `updater-keytool` that signs
# `latest.json` come from the public `zentelligence/auto-updater` repository.
# Signing needs a `RELEASE_SIGNING_KEY` repository secret set to the private key half of
# the embedded `contextos-mcp/src/update_cli.rs` production public key,
# generated by `updater-keytool generate`.
#
# No Intel macOS (x86_64-apple-darwin) leg: `ort` (via `fastembed`, used
# for semantic search) no longer ships prebuilt ONNX Runtime binaries for
# that target, upstream ONNX Runtime having dropped it; see
# https://github.com/pykeio/ort/issues/556. Revisit if that changes.
#
# Deliberately native builds on each platform's own runner rather than
# single-host cross-compilation: several dependencies (`git2`/libgit2-sys,
# `rusqlite`'s bundled SQLite, `ort`'s downloaded ONNX Runtime binaries)
# are far more reliable built for the host they actually run on than
# cross-compiled, and GitHub-hosted runners already cover every target
# triple below natively, so there is nothing to gain from cross-compiling
# instead.
#
# `workflow_dispatch` allows a manual dry run of the build and packaging
# matrix (e.g. from main, with no tag) without publishing a GitHub Release:
# the jobs after `build` only run for an actual tag push.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  MINIMUM_LAUNCHER_VERSION: "0.22.1"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "${tag_version}" != "${cargo_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version ${cargo_version} in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build contextos, contextos-web, and contextos-launcher (release)
        run: |
          cargo build --release --locked -p contextos-mcp --bin contextos --target ${{ matrix.target }}
          cargo build --release --locked -p contextos-web --bin contextos-web --target ${{ matrix.target }}
          cargo build --release --locked -p contextos-launcher --bin contextos-launcher --target ${{ matrix.target }}

      - name: Assemble the release set and generate release.json
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="contextos-${version}-${{ matrix.target }}"
          mkdir -p "${staging}/bin"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            cp "target/${{ matrix.target }}/release/contextos.exe" "${staging}/bin/"
            cp "target/${{ matrix.target }}/release/contextos-web.exe" "${staging}/bin/"
            cp "target/${{ matrix.target }}/release/contextos-launcher.exe" "${staging}/bin/"
            contextos_path="bin/contextos.exe"
            contextos_web_path="bin/contextos-web.exe"
          else
            cp "target/${{ matrix.target }}/release/contextos" "${staging}/bin/"
            cp "target/${{ matrix.target }}/release/contextos-web" "${staging}/bin/"
            cp "target/${{ matrix.target }}/release/contextos-launcher" "${staging}/bin/"
            contextos_path="bin/contextos"
            contextos_web_path="bin/contextos-web"
          fi
          # The README for people running these programs, not the repository's own.
          cp packaging/README.md "${staging}/README.md"
          # The product's own licence and notice, and the attribution every bundled third-party crate's licence
          # requires to travel with the binaries.
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md "${staging}/"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > "${staging}/release.json" <<EOF
          {
            "schema_version": 1,
            "product": "contextos",
            "version": "${version}",
            "target": "${{ matrix.target }}",
            "published_at": "${published_at}",
            "minimum_launcher_version": "${MINIMUM_LAUNCHER_VERSION}",
            "commands": [
              { "name": "contextos", "path": "${contextos_path}" },
              { "name": "contextos-web", "path": "${contextos_web_path}" }
            ]
          }
          EOF

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          staging="contextos-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          # The updater reads `release.json` from the top of the archive, so the archive holds the folder's contents,
          # not the folder. COPYFILE_DISABLE keeps macOS metadata files out.
          (cd "${staging}" && COPYFILE_DISABLE=1 tar -czf "../${staging}.tar.gz" *)
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $staging = "contextos-$version-${{ matrix.target }}"
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip"
          $hash = (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $staging.zip" | Out-File -Encoding ascii -NoNewline "$staging.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: contextos-${{ matrix.target }}
          path: |
            contextos-*.tar.gz
            contextos-*.tar.gz.sha256
            contextos-*.zip
            contextos-*.zip.sha256
          if-no-files-found: error

  manifest:
    name: build and sign latest.json
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The same commit Cargo.toml pins the updater crates to, so the signing tool matches the updater it signs for.
      - name: Check out the updater workspace's signing tool
        uses: actions/checkout@v7
        with:
          repository: zentelligence/auto-updater
          ref: 715093a3259c83945cb667cc56b69fde0823d281
          path: auto-updater

      - uses: dtolnay/rust-toolchain@stable

      - name: Build updater-keytool
        run: cargo build --release --locked -p updater-keytool --manifest-path auto-updater/Cargo.toml

      - name: Assemble latest.json from every target's archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          released_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          declare -A target_archive=(
            ["x86_64-unknown-linux-gnu"]="tar.gz"
            ["x86_64-pc-windows-msvc"]="zip"
            ["aarch64-apple-darwin"]="tar.gz"
          )

          assets="[]"
          for target in "${!target_archive[@]}"; do
            ext="${target_archive[$target]}"
            archive="contextos-${version}-${target}.${ext}"
            sha256="$(cut -d' ' -f1 "dist/${archive}.sha256")"
            size="$(stat -c%s "dist/${archive}" 2>/dev/null || stat -f%z "dist/${archive}")"
            asset="$(jq -n \
              --arg target "$target" \
              --arg url "${base_url}/${archive}" \
              --arg sha256 "$sha256" \
              --argjson size "$size" \
              '{target: $target, url: $url, sha256: $sha256, size: $size}')"
            assets="$(echo "$assets" | jq --argjson asset "$asset" '. + [$asset]')"
          done

          jq -n \
            --arg version "$version" \
            --arg released_at "$released_at" \
            --arg minimum_launcher_version "${MINIMUM_LAUNCHER_VERSION}" \
            --arg release_notes_url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --argjson assets "$assets" \
            '{
              schema_version: 1,
              product: "contextos",
              channel: "stable",
              version: $version,
              released_at: $released_at,
              minimum_supported_version: $version,
              minimum_launcher_version: $minimum_launcher_version,
              release_notes_url: $release_notes_url,
              assets: $assets
            }' > dist/latest.json

      - name: Sign latest.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          echo -n "${RELEASE_SIGNING_KEY}" > /tmp/release-signing-key.txt
          auto-updater/target/release/updater-keytool sign \
            --private-key-file /tmp/release-signing-key.txt \
            --key-id release-2026 \
            dist/latest.json > dist/latest.json.sig
          rm -f /tmp/release-signing-key.txt

      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: |
            dist/latest.json
            dist/latest.json.sig
          if-no-files-found: error

  publish:
    name: publish release
    needs: manifest
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with checksummed, signed release sets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag \
            --prerelease

  verify-install:
    name: verify install (${{ matrix.target }})
    needs: publish
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            suffix: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install the published release set and run it through the launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag's own manifest, because `releases/latest` does not serve a prerelease.
          CONTEXTOS_UPDATE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json
          CONTEXTOS_INSTALL_ROOT: ${{ runner.temp }}/install-root
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          suffix="${{ matrix.suffix }}"
          work="${RUNNER_TEMP}/verify"
          mkdir -p "${work}/unpacked" "${work}/path"

          asset="contextos-${version}-${{ matrix.target }}.${{ matrix.archive }}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "${asset}" --dir "${work}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z x -bd -o"${work}/unpacked" "${work}/${asset}"
          else
            tar -xzf "${work}/${asset}" -C "${work}/unpacked"
          fi

          "${work}/unpacked/bin/contextos${suffix}" install --version "${version}"
          "${work}/unpacked/bin/contextos${suffix}" update check

          # One launcher binary serves both commands, under each public name.
          cp "${work}/unpacked/bin/contextos-launcher${suffix}" "${work}/path/contextos${suffix}"
          cp "${work}/unpacked/bin/contextos-launcher${suffix}" "${work}/path/contextos-web${suffix}"
          expect() {
            local actual
            actual="$("$1" --version | tr -d '\r')"
            if [ "${actual}" != "$2" ]; then
              echo "::error::$1 reported '${actual}', expected '$2'"
              exit 1
            fi
          }
          expect "${work}/path/contextos${suffix}" "ContextOS ${version}"
          expect "${work}/path/contextos-web${suffix}" "ContextOS Web ${version}"

          # A registration made through the launcher must record the launcher, so it survives later updates.
          "${work}/path/contextos${suffix}" --config "${work}/config.toml" config mcp register \
            --host claude-desktop --config-path "${work}/host.json" --force
          grep -Eq 'path[/\\]+contextos' "${work}/host.json" || {
            echo "::error::the registration did not record the launcher"
            cat "${work}/host.json"
            exit 1
          }

  promote:
    name: promote to latest
    needs: verify-install
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Make the verified release the one clients receive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease=false --latest
